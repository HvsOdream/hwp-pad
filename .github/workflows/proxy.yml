# 서일 오피스 AI 중계 서버(proxy/)를 Cloudflare Workers에 배포한다.
# 저장소 Secrets(사람이 직접 넣음):
#   CLOUDFLARE_API_TOKEN   Cloudflare 토큰 (템플릿 "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#   ANTHROPIC_API_KEY      학교 Claude API 키 — 이 서버에만 들어가고 앱에는 없다
#   SEOIL_ADMIN_TOKEN      관리 화면(/admin) 들어가는 비밀번호(길게 아무 글자)
name: Deploy AI proxy
on:
  push:
    branches: [main]
    paths: ['proxy/**', '.github/workflows/proxy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.157.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare 시크릿이 아직 없어 배포를 건너뜁니다."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: KV namespace (없으면 만든다)
        if: steps.chk.outputs.skip != '1'
        run: |
          find_id() { $WRANGLER kv namespace list 2>/dev/null | sed -n '/^\[/,$p' | jq -r '.[] | select(.title|test("seoil-ai-kv";"i")) | .id' | head -1; }
          id=$(find_id)
          if [ -z "$id" ]; then $WRANGLER kv namespace create seoil-ai-kv; id=$(find_id); fi
          test -n "$id" || { echo "KV id를 찾지 못함"; exit 1; }
          sed -i "s/__KV_ID__/$id/" wrangler.toml
          echo "KV id: $id"
      - name: Deploy
        if: steps.chk.outputs.skip != '1'
        run: |
          $WRANGLER deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### AI 중계 서버: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "관리 화면: $url/admin" >> "$GITHUB_STEP_SUMMARY"
      - name: Secrets
        if: steps.chk.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEOIL_ADMIN_TOKEN: ${{ secrets.SEOIL_ADMIN_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | $WRANGLER secret put ANTHROPIC_API_KEY; else echo "::warning::ANTHROPIC_API_KEY 없음"; fi
          if [ -n "$SEOIL_ADMIN_TOKEN" ]; then printf '%s' "$SEOIL_ADMIN_TOKEN" | $WRANGLER secret put ADMIN_TOKEN; else echo "::warning::SEOIL_ADMIN_TOKEN 없음"; fi
