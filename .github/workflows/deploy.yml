# 서일 오피스 (레포: hwp-pad) — 이음오피스(pblsketch/openoffice)의 HWP 편집기(rhwp-studio + 이음 패치)를
# GitHub Pages에 PWA로 배포한다. 아이패드 사파리·PC 크롬에서 열어 홈 화면/앱으로 설치해 쓴다.
#
# 이 레포에는 이 파일 하나만 있어도 된다. 매니페스트·아이콘·.nojekyll은 빌드 중에 만든다.
# 처음 한 번: Settings → Pages → Build and deployment → Source = "GitHub Actions"
# (configure-pages의 enablement:true가 자동으로 켜 주지만, 안 켜지면 수동으로.)
#
# 결과: https://hvsodream.github.io/hwp-pad/

name: Deploy hwp-pad to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openoffice_ref:
        description: 'pblsketch/openoffice ref to build (branch, tag or commit)'
        required: false
        default: 'main'
  schedule:
    # 매주 월요일 03:00 KST(일 18:00 UTC) — openoffice 최신 main을 다시 빌드해 반영
    - cron: '0 18 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  OPENOFFICE_REPO: pblsketch/openoffice
  SITE_NAME: '서일 오피스'
  SITE_SHORT: '서일'
  ICON_TEXT: '서일'
  THEME_COLOR: '#1f2937'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hwp-pad (this repo)
        uses: actions/checkout@v4

      - name: Checkout openoffice
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENOFFICE_REPO }}
          ref: ${{ github.event.inputs.openoffice_ref || 'main' }}
          path: openoffice

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openoffice/package-lock.json

      # postinstall(install-electron)은 건너뛴다. 스튜디오 빌드는 vite + @rhwp/core(vendor)만 쓴다.
      - name: Install dependencies
        working-directory: openoffice
        run: npm ci --ignore-scripts

      # scripts/build-studio.mjs: rhwp v0.8.7(핀 커밋)을 sparse-clone → 이음 패치(한컴 단축키·모양 복사·메모 등)
      # 적용 → apps/hwp/public/studio 에 base './' 상대경로 번들 생성
      # 이음 빌드는 오프라인 앱이라 CDN 웹폰트를 끄고(public/fonts도 제외) OS 글꼴에 기댄다.
      # 아이패드에는 함초롬바탕/맑은 고딕이 없어 글꼴 없이 편집 → 줄바꿈 등에서 에러.
      # 원본 사이트(edwardkim.github.io/rhwp)처럼 CDN 웹폰트를 켜고 번들 글꼴(assets/fonts)도 받는다.
      - name: Patch build for the web (webfonts on, bundled fonts in)
        working-directory: openoffice
        run: |
          f=apps/hwp/scripts/build-studio.mjs
          sed -i "s/__RHWP_DISABLE_EXTERNAL_WEBFONTS__: 'true'/__RHWP_DISABLE_EXTERNAL_WEBFONTS__: 'false'/" "$f"
          sed -i "s#  '!/rhwp-studio/public/fonts',#  '/assets/fonts/',#" "$f"
          grep -n "__RHWP_DISABLE_EXTERNAL_WEBFONTS__: 'false'" "$f"
          grep -n "'/assets/fonts/'" "$f"
          node --check "$f"

      # 1차 빌드: rhwp 소스를 node_modules/.cache/rhwp-studio/<tag>/ 에 받아 둔다
      - name: Build rhwp-studio with 이음 patches
        working-directory: openoffice
        run: npm run studio -w @genoffice/hwp -- --force

      # hwp-pad 자체 패치(patches/*.mjs)를 받아 둔 rhwp 소스에 적용하고 다시 빌드한다.
      # build-studio.mjs는 캐시의 HEAD가 핀 커밋이면 다시 받지 않으므로 수정본이 그대로 번들된다.
      - name: Apply hwp-pad patches to rhwp-studio source
        run: |
          engine=$(ls -d openoffice/apps/hwp/node_modules/.cache/rhwp-studio/*/rhwp-studio/src/engine)
          echo "engine dir: $engine"
          for p in patches/*.mjs; do node "$p" "$engine"; done
          # 한글 Ctrl+G,Z(전체 화면) → 단축키 모드. 명령 hwppad:fullscreen은 hancom-web.mjs가 view.ts에 넣었으므로
          # 이제 이음 build-studio의 명령 존재 검사를 통과한다(1차 빌드 전에 넣으면 검사에 걸림).
          k=openoffice/apps/hwp/studio-plugin/hancom-keys.mjs
          sed -i "0,/^  g: {$/s//  g: {\n    z: 'hwppad:fullscreen',/" "$k"
          grep -n "hwppad:fullscreen" "$k" "$engine/../command/commands/view.ts"
          node --check "$k"
          grep -n "\[hwp-pad\]" "$engine/input-handler-keyboard.ts" "$engine/input-handler-mouse.ts"
          grep -n "서일" "$engine/../ui/document-title.ts" "$engine/../../index.html"

      - name: Rebuild rhwp-studio with hwp-pad patches
        working-directory: openoffice
        run: |
          npm run studio -w @genoffice/hwp -- --force 2>&1 | tee /tmp/studio-build.log
          grep -q "rhwp-studio: built" /tmp/studio-build.log
          # 번들에 패치가 들어갔는지: _iosAnchor 초기화 코드의 흔적(문자열은 minify로 바뀌므로 소스 쪽을 확인)
          grep -c "\[hwp-pad\]" apps/hwp/node_modules/.cache/rhwp-studio/*/rhwp-studio/src/engine/input-handler-keyboard.ts

      # ubuntu-24.04 runner에는 ImageMagick이 없다 (22.04까지는 있었음) → 아이콘 생성용으로 설치
      - name: Install ImageMagick (for icons)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends imagemagick fonts-dejavu-core fonts-nanum > /dev/null
          convert -version | head -1
          ls /usr/share/fonts/truetype/nanum/ | head -3

      - name: Assemble site (manifest, icons, iOS meta)
        env:
          STUDIO_OUT: openoffice/apps/hwp/public/studio
          OPENOFFICE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f "$STUDIO_OUT/index.html"
          rm -rf site && mkdir -p site/icons
          cp -r "$STUDIO_OUT"/. site/
          rm -f site/.stamp
          touch site/.nojekyll

          # --- 번들 글꼴: vite가 public/fonts 심볼릭 링크를 못 따라갔을 때를 대비해 직접 복사 ---
          mkdir -p site/fonts
          cp -n openoffice/apps/hwp/node_modules/.cache/rhwp-studio/*/assets/fonts/*.woff2 site/fonts/ || true
          cp -n openoffice/apps/hwp/node_modules/.cache/rhwp-studio/*/assets/fonts/*.txt openoffice/apps/hwp/node_modules/.cache/rhwp-studio/*/assets/fonts/*.md site/fonts/ 2>/dev/null || true
          echo "fonts: $(ls site/fonts | wc -l) files"
          test -f site/fonts/NotoSansKR-Regular.woff2

          # --- icons: 「서일」 두 글자 (나눔고딕 볼드; 없으면 단색 배경만) ---
          ICON_FONT=/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf
          make_icon() {
            local size="$1" out="$2"
            convert -size "${size}x${size}" xc:"$THEME_COLOR" \
              -fill white -gravity center \
              -font "$ICON_FONT" -pointsize "$((size * 40 / 100))" -annotate +0+$((size * 2 / 100)) "$ICON_TEXT" \
              "$out" 2>/dev/null \
            || convert -size "${size}x${size}" xc:"$THEME_COLOR" "$out"
          }
          make_icon 180 site/icons/apple-touch-icon.png
          make_icon 192 site/icons/icon-192.png
          make_icon 512 site/icons/icon-512.png
          # maskable: 여백 있는 버전
          convert site/icons/icon-512.png -gravity center -background "$THEME_COLOR" -extent 640x640 -resize 512x512 site/icons/icon-512-maskable.png

          # --- manifest ---
          cat > site/manifest.webmanifest <<EOF
          {
            "name": "$SITE_NAME",
            "short_name": "$SITE_SHORT",
            "description": "서일 오피스 — 어디서나 HWP/HWPX 문서 편집 (rhwp-studio + 이음오피스 패치, PWA)",
            "id": "./",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "any",
            "background_color": "#ffffff",
            "theme_color": "$THEME_COLOR",
            "lang": "ko",
            "icons": [
              { "src": "icons/icon-192.png", "sizes": "192x192", "type": "image/png" },
              { "src": "icons/icon-512.png", "sizes": "512x512", "type": "image/png" },
              { "src": "icons/icon-512-maskable.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ],
            "file_handlers": [
              {
                "action": "./",
                "accept": {
                  "application/x-hwp": [".hwp"],
                  "application/hwp+zip": [".hwpx"],
                  "application/vnd.hancom.hwp": [".hwp"],
                  "application/vnd.hancom.hwpx": [".hwpx"]
                }
              }
            ]
          }
          EOF

          # --- 디버그 오버레이: ?debug 로 열면 키 이벤트·에러를 화면에 띄운다 (아이패드 진단용) ---
          cat > site/debug.js <<'EOF'
          (function () {
            if (!/[?#&]debug/.test(location.search + location.hash)) return;
            var MAX = 60, lines = [], box, pre, armed = false;
            function fmt(v) { try { return typeof v === 'string' ? v : JSON.stringify(v); } catch (e) { return String(v); } }
            function log(tag, data) {
              var t = new Date().toISOString().slice(11, 23);
              lines.push(t + ' ' + tag + ' ' + fmt(data));
              if (lines.length > MAX) lines.shift();
              if (pre) { pre.textContent = lines.join('\n'); pre.scrollTop = pre.scrollHeight; }
            }
            function mount() {
              if (box) return;
              box = document.createElement('div');
              box.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;max-height:38vh;z-index:2147483647;background:rgba(0,0,0,.88);color:#9f9;font:11px/1.35 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;pointer-events:auto');
              var bar = document.createElement('div');
              bar.setAttribute('style', 'display:flex;gap:8px;padding:4px 8px;background:#222;color:#fff;align-items:center');
              bar.innerHTML = '<b>hwp-pad debug</b><span id="dbg-ua" style="opacity:.7;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></span>';
              var copy = document.createElement('button'); copy.textContent = '복사'; copy.setAttribute('style', 'font:12px sans-serif;padding:2px 10px');
              copy.onclick = function () { var txt = header() + '\n' + lines.join('\n'); try { navigator.clipboard.writeText(txt).then(function(){ copy.textContent = '복사됨'; }, function(){ fallback(txt); }); } catch (e) { fallback(txt); } };
              var clear = document.createElement('button'); clear.textContent = '지움'; clear.setAttribute('style', 'font:12px sans-serif;padding:2px 10px');
              clear.onclick = function () { lines = []; pre.textContent = ''; };
              var close = document.createElement('button'); close.textContent = '닫기'; close.setAttribute('style', 'font:12px sans-serif;padding:2px 10px');
              close.onclick = function () { box.remove(); box = null; pre = null; };
              bar.appendChild(copy); bar.appendChild(clear); bar.appendChild(close);
              pre = document.createElement('pre');
              pre.setAttribute('style', 'margin:0;padding:6px 8px;overflow:auto;flex:1;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text');
              box.appendChild(bar); box.appendChild(pre);
              document.body.appendChild(box);
              bar.querySelector('#dbg-ua').textContent = navigator.userAgent;
              pre.textContent = lines.join('\n');
            }
            function fallback(txt) { var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('style', 'position:fixed;top:10px;left:10px;width:80vw;height:40vh;z-index:2147483647;font:11px monospace'); document.body.appendChild(ta); ta.select(); }
            function header() { return 'UA: ' + navigator.userAgent + '\nURL: ' + location.href + '\nbuild: ' + (document.querySelector('script[src*="assets/index"]') || {}).src; }
            function keyInfo(e) {
              return { key: e.key, code: e.code, kc: e.keyCode, comp: e.isComposing, mods: (e.ctrlKey?'C':'')+(e.shiftKey?'S':'')+(e.altKey?'A':'')+(e.metaKey?'M':''), tgt: (e.target && (e.target.tagName + (e.target.id ? '#' + e.target.id : '') + (e.target.className && typeof e.target.className === 'string' ? '.' + e.target.className.split(' ')[0] : ''))) };
            }
            window.addEventListener('keydown', function (e) {
              var info = keyInfo(e);
              setTimeout(function () { info.dp = e.defaultPrevented; log('keydown', info); }, 0);
            }, true);
            window.addEventListener('keyup', function (e) { if (e.key === 'Enter') log('keyup', { key: e.key, kc: e.keyCode, comp: e.isComposing }); }, true);
            window.addEventListener('keypress', function (e) { if (e.key === 'Enter' || e.keyCode === 13) log('keypress', { key: e.key, kc: e.keyCode, dp: e.defaultPrevented }); }, true);
            window.addEventListener('beforeinput', function (e) { log('beforeinput', { type: e.inputType, data: e.data, comp: e.isComposing, dp: e.defaultPrevented }); }, true);
            window.addEventListener('input', function (e) { log('input', { type: e.inputType, data: e.data, comp: e.isComposing }); }, true);
            window.addEventListener('compositionstart', function (e) { log('compositionstart', e.data); }, true);
            window.addEventListener('compositionupdate', function (e) { log('compositionupdate', e.data); }, true);
            window.addEventListener('compositionend', function (e) { log('compositionend', e.data); }, true);
            window.addEventListener('error', function (e) { log('ERROR', (e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno + (e.error && e.error.stack ? '\n' + String(e.error.stack).split('\n').slice(0, 4).join('\n') : '')); });
            window.addEventListener('unhandledrejection', function (e) { var r = e.reason; log('REJECT', r && r.stack ? String(r.stack).split('\n').slice(0, 4).join('\n') : fmt(r)); });
            ['error', 'warn'].forEach(function (lvl) {
              var orig = console[lvl];
              console[lvl] = function () { try { log('console.' + lvl, Array.prototype.map.call(arguments, function (a) { return a && a.stack ? String(a.stack).split('\n').slice(0, 3).join(' | ') : fmt(a); }).join(' ')); } catch (e) {} return orig.apply(console, arguments); };
            });
            log('debug', 'overlay on; press keys, then 복사');
            if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
          })();
          EOF

          # --- 설치 안내: 브라우저 탭으로 열었을 때 "앱으로 설치" 한 줄 (설치형 창에서는 안 뜸, 닫으면 기억) ---
          cat > site/install.js <<'EOF'
          (function () {
            var standalone = window.matchMedia('(display-mode: standalone), (display-mode: minimal-ui), (display-mode: window-controls-overlay)').matches
              || window.navigator.standalone === true;
            if (standalone) return;
            try { if (localStorage.getItem('hwppad.installHint') === 'off') return; } catch (e) {}
            var ua = navigator.userAgent;
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Chrome|Chromium/.test(ua);
            var deferred = null;
            window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; show(); });
            function show() {
              if (document.getElementById('hwppad-install')) return;
              var bar = document.createElement('div');
              bar.id = 'hwppad-install';
              bar.setAttribute('style', 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483000;background:#1f2937;color:#fff;font:13px/1.4 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:10px 14px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;max-width:92vw');
              var msg = document.createElement('span');
              var btn = document.createElement('button');
              btn.setAttribute('style', 'font:13px sans-serif;padding:5px 12px;border:0;border-radius:6px;background:#60a5fa;color:#0b1220;font-weight:600;white-space:nowrap');
              var close = document.createElement('button');
              close.textContent = '×'; close.title = '다시 보지 않기';
              close.setAttribute('style', 'font:16px sans-serif;background:none;border:0;color:#cbd5e1;padding:0 2px');
              if (deferred) {
                msg.textContent = '주소창 없이 앱처럼 쓰려면';
                btn.textContent = '앱으로 설치';
                btn.onclick = function () { var d = deferred; deferred = null; if (d) { d.prompt(); d.userChoice.then(function () { bar.remove(); }); } };
              } else if (isIOS) {
                msg.textContent = isSafari
                  ? '앱처럼 쓰려면: 공유(⬆︎) → 「홈 화면에 추가」'
                  : '앱처럼 쓰려면 사파리에서 열고 공유 → 「홈 화면에 추가」';
                btn.style.display = 'none';
              } else {
                return; // 설치 불가 브라우저: 조용히
              }
              close.onclick = function () { try { localStorage.setItem('hwppad.installHint', 'off'); } catch (e) {} bar.remove(); };
              bar.appendChild(msg); bar.appendChild(btn); bar.appendChild(close);
              document.body.appendChild(bar);
            }
            if (isIOS) {
              if (document.body) setTimeout(show, 1500); else document.addEventListener('DOMContentLoaded', function () { setTimeout(show, 1500); });
            }
            window.addEventListener('appinstalled', function () { var b = document.getElementById('hwppad-install'); if (b) b.remove(); });
          })();
          EOF

          # --- 단축키 모드(PC 크롬·엣지): 전체화면 + Keyboard Lock으로 Ctrl+N/T/W 같은 브라우저 단축키를 한글 단축키로 넘김 ---
          # Ctrl+N,T(표)·Ctrl+N,F(각주)·Ctrl+T,*(문단) 등은 일반 탭·설치형 창에서는 브라우저가 먼저 가로챈다(새 창·새 탭·탭 닫기).
          # JS로 연 전체화면 안에서 navigator.keyboard.lock()을 걸면 페이지가 그 키를 먼저 받는다. Ctrl+G,Z(한글 전체 화면) 또는 우하단 버튼으로 켜고, Esc 길게 눌러 해제.
          cat > site/keylock.js <<'EOF'
          (function () {
            var kb = navigator.keyboard;
            if (!kb || typeof kb.lock !== 'function' || !document.documentElement.requestFullscreen) return; // 사파리·아이패드: 해당 없음(브라우저 단축키가 Cmd라 충돌 없음)
            var LS = 'hwppad.keylock';
            var KEYS = [];
            for (var c = 65; c <= 90; c++) KEYS.push('Key' + String.fromCharCode(c));
            for (var d = 0; d <= 9; d++) KEYS.push('Digit' + d);
            for (var f = 1; f <= 12; f++) KEYS.push('F' + f);
            KEYS.push('Escape', 'Enter', 'Backspace', 'Delete', 'Insert', 'Home', 'End', 'PageUp', 'PageDown',
              'Minus', 'Equal', 'BracketLeft', 'BracketRight', 'Backslash', 'Semicolon', 'Quote', 'Comma', 'Period', 'Slash', 'Backquote');
            var locked = false, toastT = null;
            function pref() { try { return localStorage.getItem(LS); } catch (e) { return null; } }
            function setPref(v) { try { localStorage.setItem(LS, v); } catch (e) {} }
            function toast(msg, ms) {
              var t = document.getElementById('hwppad-keylock-toast');
              if (!t) {
                t = document.createElement('div'); t.id = 'hwppad-keylock-toast';
                t.setAttribute('style', 'position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:2147483000;background:#111827;color:#f9fafb;font:13px/1.5 -apple-system,"Malgun Gothic",sans-serif;padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:92vw;pointer-events:none;transition:opacity .3s');
                document.body.appendChild(t);
              }
              t.textContent = msg; t.style.opacity = '1';
              clearTimeout(toastT); toastT = setTimeout(function () { t.style.opacity = '0'; }, ms || 3500);
            }
            function enter() {
              if (document.fullscreenElement) { lock(); return; }
              var p = document.documentElement.requestFullscreen({ navigationUI: 'hide' });
              if (p && p.then) p.then(lock, function (e) { toast('전체화면 전환 실패: ' + (e && e.message || e)); });
            }
            function lock() {
              kb.lock(KEYS).then(function () {
                locked = true; render();
                toast('단축키 모드 켜짐 — Ctrl+N,T(표)·Ctrl+T·Ctrl+W 등 브라우저 단축키도 한글처럼 동작합니다. 해제: Esc 길게 누르기 또는 Ctrl+G,Z', 6000);
              }, function (e) { toast('키 잠금 실패: ' + (e && e.message || e)); });
            }
            function leave() { try { kb.unlock(); } catch (e) {} locked = false; if (document.fullscreenElement) document.exitFullscreen(); render(); }
            document.addEventListener('fullscreenchange', function () {
              if (!document.fullscreenElement) { try { kb.unlock(); } catch (e) {} locked = false; render(); }
            });
            // 토글은 한글 Ctrl+G,Z(전체 화면)에 매인 명령 hwppad:fullscreen(patches/hancom-web.mjs)이 부른다.
            // F11은 한글대로 '개체 선택'이라 건드리지 않는다.
            function toggle() { if (locked || document.fullscreenElement) leave(); else enter(); }
            window.__hwppadKeylock = { toggle: toggle, enter: enter, leave: leave, get locked() { return locked; } };
            // 버튼
            var btn;
            function render() {
              if (!btn) return;
              btn.textContent = locked ? '⌨ 단축키 모드 켜짐' : '⌨ 단축키 모드 (Ctrl+G,Z)';
              btn.title = locked
                ? '브라우저 단축키(Ctrl+N/T/W…)를 한글 단축키로 쓰는 중. 해제: Esc 길게 또는 Ctrl+G,Z'
                : 'Ctrl+N,T 같은 조합이 새 탭/새 창으로 새면 켜세요. 전체화면 + 키 잠금 (크롬·엣지)';
              btn.style.background = locked ? '#166534' : '#1f2937';
              auto.checked = pref() === 'auto';
            }
            var auto;
            function mount() {
              var wrap = document.createElement('div');
              wrap.id = 'hwppad-keylock';
              wrap.setAttribute('style', 'position:fixed;right:12px;bottom:12px;z-index:2147482999;display:flex;gap:6px;align-items:center;font:12px/1.3 -apple-system,"Malgun Gothic",sans-serif;opacity:.85');
              btn = document.createElement('button');
              btn.setAttribute('style', 'font:inherit;padding:6px 10px;border:0;border-radius:8px;background:#1f2937;color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap');
              btn.onclick = toggle;
              var lab = document.createElement('label');
              lab.setAttribute('style', 'display:flex;gap:4px;align-items:center;background:#1f2937;color:#e5e7eb;padding:5px 8px;border-radius:8px;cursor:pointer;white-space:nowrap');
              lab.title = '켜 두면 다음에 열 때 첫 클릭에서 자동으로 단축키 모드로 들어갑니다';
              auto = document.createElement('input'); auto.type = 'checkbox';
              auto.onchange = function () { setPref(auto.checked ? 'auto' : 'off'); };
              lab.appendChild(auto); lab.appendChild(document.createTextNode('자동'));
              wrap.appendChild(btn); wrap.appendChild(lab);
              document.body.appendChild(wrap);
              render();
              // 자동 모드: 전체화면은 사용자 동작이 있어야 열리므로 첫 클릭/키 입력에 편승
              if (pref() === 'auto') {
                var once = function (e) {
                  if (e.target && e.target.closest && e.target.closest('#hwppad-keylock')) return;
                  window.removeEventListener('pointerdown', once, true); window.removeEventListener('keydown', once, true);
                  enter();
                };
                window.addEventListener('pointerdown', once, true); window.addEventListener('keydown', once, true);
                toast('자동 단축키 모드: 문서를 클릭하면 전체화면으로 전환됩니다', 5000);
              }
            }
            if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
          })();
          EOF

      # (Assemble 단계가 GitHub의 run 스크립트 길이 한도(21000자)를 넘어 둘로 나눴다)
      - name: Assemble site — 안내 페이지·시작 안내·네이티브 훅
        env:
          OPENOFFICE_REF: ${{ github.event.inputs.openoffice_ref || 'main' }}
          OPENOFFICE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --- 단축키 안내 페이지: docs/단축키_대조표.md → site/shortcuts.html (표만 있는 마크다운이라 작은 변환기로 충분) ---
          node - <<'EOF'
          const fs = require('fs');
          const md = fs.readFileSync('docs/단축키_대조표.md', 'utf8');
          const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          let out = [], table = null;
          const flush = () => { if (table) { out.push('<table>' + table.join('') + '</table>'); table = null; } };
          for (const raw of md.split('\n')) {
            const line = raw.trimEnd();
            if (/^\|/.test(line)) {
              const cells = line.slice(1, line.endsWith('|') ? -1 : undefined).split('|').map((c) => c.trim());
              if (cells.every((c) => /^-+$/.test(c))) continue;
              const tag = table ? 'td' : 'th';
              if (!table) table = [];
              table.push('<tr>' + cells.map((c) => `<${tag}>${inline(c)}</${tag}>`).join('') + '</tr>');
              continue;
            }
            flush();
            if (/^# /.test(line)) out.push(`<h1>${inline(line.slice(2))}</h1>`);
            else if (/^## /.test(line)) out.push(`<h2>${inline(line.slice(3))}</h2>`);
            else if (/^- /.test(line)) out.push(`<li>${inline(line.slice(2))}</li>`);
            else if (line) out.push(`<p>${inline(line)}</p>`);
          }
          flush();
          const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>${process.env.SITE_NAME} — 단축키 안내</title>
          <style>
            :root{color-scheme:light dark;--fg:#111827;--bg:#fff;--line:#e5e7eb;--muted:#6b7280;--acc:#1d4ed8}
            @media(prefers-color-scheme:dark){:root{--fg:#e5e7eb;--bg:#111827;--line:#374151;--muted:#9ca3af;--acc:#93c5fd}}
            body{margin:0;padding:24px 16px 60px;font:14px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--fg);background:var(--bg)}
            main{max-width:860px;margin:0 auto}h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:28px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
            p{margin:6px 0;color:var(--muted)}li{margin:4px 0 4px 18px}code{font:12px ui-monospace,Consolas,monospace;background:rgba(127,127,127,.15);padding:1px 5px;border-radius:4px}
            table{border-collapse:collapse;width:100%;margin:6px 0}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:rgba(127,127,127,.1)}
            td:nth-child(2){white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
            .top{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;gap:12px;align-items:center}
            .top a{color:var(--acc);text-decoration:none}.top .sp{flex:1}
            .box{border:1px solid var(--line);border-left:4px solid var(--acc);padding:10px 14px;border-radius:6px;margin:14px 0}
          </style></head><body><main>
          <div class="top"><a href="./">← 편집기로</a><span class="sp"></span><a href="#" onclick="window.print();return false">인쇄</a></div>
          <div class="box"><strong>먼저 알아둘 것</strong><br>
          • 한글 2024와 같은 키를 그대로 씁니다. 별도의 단축키 설정 화면은 없습니다(한글의 「사용자 설정 → 단축키」 같은 바꾸기 기능은 아직 없음).<br>
          • 🔒 표시 키(Ctrl+N 계열 등)는 <strong>단축키 모드</strong>에서만 됩니다 — PC 크롬·엣지에서 <code>Ctrl+G, Z</code> 또는 오른쪽 아래 ⌨ 버튼. 나올 땐 Esc 길게.<br>
          • 명령을 이름으로 찾으려면 <code>Ctrl+/</code> (명령 팔레트).</div>
          ${out.join('\n')}
          </main></body></html>`;
          fs.writeFileSync('site/shortcuts.html', html);
          console.log('shortcuts.html', html.length, 'bytes');
          EOF

          # --- 시작 안내: 처음 열 때 한 번 (단축키 모드·저장·단축키 목록). 다시 보기는 ⌨ 옆 「?」 ---
          cat > site/guide.js <<'EOF'
          (function () {
            var LS = 'hwppad.guide.v1';
            var ua = navigator.userAgent;
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var hasLock = !!(navigator.keyboard && navigator.keyboard.lock);
            function seen() { try { return localStorage.getItem(LS) === 'off'; } catch (e) { return false; } }
            function open() {
              if (document.getElementById('hwppad-guide')) return;
              var bg = document.createElement('div');
              bg.id = 'hwppad-guide';
              bg.setAttribute('style', 'position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px');
              var card = document.createElement('div');
              card.setAttribute('style', 'background:#fff;color:#111827;max-width:520px;width:100%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:22px 24px;font:14px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif');
              var rows = [];
              rows.push('<div style="font-size:19px;font-weight:700;margin-bottom:4px">서일 오피스에 오신 것을 환영합니다</div>');
              rows.push('<div style="color:#6b7280;margin-bottom:14px">한글(HWP·HWPX) 문서를 어디서나 열고 고칩니다. 한글 2024 단축키를 그대로 씁니다.</div>');
              if (hasLock && !isIOS) {
                rows.push('<div style="border-left:4px solid #1d4ed8;background:#eff6ff;padding:10px 12px;border-radius:6px;margin:10px 0"><b>⌨ 단축키 모드부터 켜세요</b><br>'
                  + 'Ctrl+N,T(표)·Ctrl+T·Ctrl+W 같은 조합은 브라우저가 먼저 가져갑니다. <b>Ctrl+G, Z</b> 또는 오른쪽 아래 ⌨ 버튼을 누르면 전체 화면이 되면서 모든 키가 한글처럼 동작합니다. '
                  + '나올 때는 <b>Esc를 길게</b>. ⌨ 옆 「자동」을 켜 두면 다음부터 문서를 클릭할 때 저절로 켜집니다.</div>');
              } else if (isIOS) {
                rows.push('<div style="border-left:4px solid #1d4ed8;background:#eff6ff;padding:10px 12px;border-radius:6px;margin:10px 0"><b>아이패드</b><br>'
                  + '외장 키보드의 Ctrl·Alt 단축키가 그대로 됩니다. 저장은 공유 시트 → 「파일에 저장」으로 Dropbox 폴더를 고르세요. 홈 화면에 추가하면 앱처럼 열립니다.</div>');
              }
              rows.push('<ul style="margin:10px 0 14px 18px;padding:0;color:#374151">'
                + '<li><b>열기</b> Alt+O · <b>저장</b> Alt+S / Ctrl+S · <b>다른 이름으로</b> Alt+V · <b>인쇄</b> Alt+P</li>'
                + '<li><b>표</b> Ctrl+N,T · <b>글자 모양</b> Alt+L · <b>문단 모양</b> Alt+T · <b>모양 복사</b> Alt+C · <b>문자표</b> Ctrl+F10</li>'
                + '<li><b>명령 찾기</b> Ctrl+/ (명령 팔레트) · <b>단축키 전체 목록</b> 아래 버튼 또는 ⌨ 옆 「?」</li>'
                + (isIOS ? '' : '<li><b>저장 폴더</b> 파일 메뉴 → 「저장 폴더 지정…」(PC는 Ctrl+S로 제자리 덮어쓰기)</li>')
                + '</ul>');
              rows.push('<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
                + '<button id="hwppad-guide-list" style="font:inherit;padding:8px 14px;border:1px solid #d1d5db;border-radius:8px;background:#f9fafb;cursor:pointer">단축키 전체 목록</button>'
                + '<span style="flex:1"></span>'
                + '<label style="display:flex;gap:6px;align-items:center;color:#6b7280;font-size:13px"><input type="checkbox" id="hwppad-guide-off" checked>다시 보지 않기</label>'
                + '<button id="hwppad-guide-ok" style="font:inherit;padding:8px 16px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-weight:600;cursor:pointer">시작하기</button>'
                + '</div>');
              card.innerHTML = rows.join('');
              bg.appendChild(card);
              document.body.appendChild(bg);
              function close() {
                var off = document.getElementById('hwppad-guide-off');
                try { localStorage.setItem(LS, off && off.checked ? 'off' : 'on'); } catch (e) {}
                bg.remove();
              }
              document.getElementById('hwppad-guide-ok').onclick = close;
              document.getElementById('hwppad-guide-list').onclick = function () { window.open('shortcuts.html', '_blank'); };
              bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
              bg.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } }, true);
              document.getElementById('hwppad-guide-ok').focus();
            }
            function mountHelp() {
              var wrap = document.getElementById('hwppad-keylock');
              var help = document.createElement('button');
              help.id = 'hwppad-help';
              help.textContent = '?';
              help.title = '시작 안내 · 단축키 목록';
              help.setAttribute('style', 'font:13px/1 -apple-system,"Malgun Gothic",sans-serif;width:26px;height:26px;border:0;border-radius:50%;background:#1f2937;color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.3);cursor:pointer');
              help.onclick = open;
              if (wrap) { wrap.insertBefore(help, wrap.firstChild); }
              else {
                help.style.position = 'fixed'; help.style.right = '12px'; help.style.bottom = '12px'; help.style.zIndex = '2147482999'; help.style.opacity = '.85';
                document.body.appendChild(help);
              }
            }
            function boot() {
              // keylock.js(defer)가 먼저 버튼 묶음을 만든 뒤에 붙는다
              setTimeout(function () {
                mountHelp();
                /* 첫 화면은 서일 오피스 홈이 맡는다 — 안내는 ? 버튼으로만 */
              }, 0);
            }
            if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
          })();
          EOF

          # --- AI 작성 도우미 (web/: 양식 칸 쓰기 + 패널) ---
          cp web/seoil-form.js web/seoil-fill.js web/seoil-write.js web/seoil-dialog.js web/ai-panel.js web/seoil-start.js web/seoil-agent.js site/
          # 앱에 넣어 둘 학교 원본 양식(있으면): web/forms/업무협조전.hwp → 시작 화면이 기본 양식으로 쓴다
          if [ -d web/forms ]; then mkdir -p site/forms && cp -r web/forms/. site/forms/; fi

          # --- index.html에 매니페스트·iOS 메타 삽입 (viewport는 viewport-fit=cover로 보정) ---
          node - <<'EOF'
          const fs = require('fs');
          const p = 'site/index.html';
          let html = fs.readFileSync(p, 'utf8');
          const theme = process.env.THEME_COLOR;
          const name = process.env.SITE_NAME;
          const inject = [
            '<link rel="manifest" href="manifest.webmanifest">',
            `<meta name="theme-color" content="${theme}">`,
            '<meta name="mobile-web-app-capable" content="yes">',
            '<meta name="apple-mobile-web-app-capable" content="yes">',
            '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
            `<meta name="apple-mobile-web-app-title" content="${name}">`,
            '<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">',
            '<script src="debug.js"></script>',
            '<script src="keylock.js" defer></script>',
            '<script src="guide.js" defer></script>',
            '<script src="seoil-form.js" defer></script>',
            '<script src="seoil-fill.js" defer></script>',
            '<script src="seoil-write.js" defer></script>',
            '<script src="seoil-dialog.js" defer></script>',
            '<script src="ai-panel.js" defer></script>',
            '<script src="seoil-start.js" defer></script>',
            '<script src="seoil-agent.js" defer></script>',
            `<!-- built from ${process.env.OPENOFFICE_REPO} @ ${new Date().toISOString()} by hwp-pad ${process.env.OPENOFFICE_SHA} -->`,
          ].join('\n    ');
          if (!/rel="manifest"/.test(html)) {
            html = html.replace(/<\/head>/i, `    ${inject}\n  </head>`);
          }
          // 아이패드 홈화면 모드에서 노치/홈바 영역까지 쓰도록
          html = html.replace(
            /<meta\s+name="viewport"\s+content="([^"]*)"\s*\/?>/i,
            (m, c) => (/viewport-fit/.test(c) ? m : `<meta name="viewport" content="${c}, viewport-fit=cover">`),
          );
          fs.writeFileSync(p, html);
          console.log('index.html patched:', fs.statSync(p).size, 'bytes');
          EOF

          # --- 버전(루트 VERSION 한 곳) → version.json + index.html의 window.SEOIL_BUILD ---
          SEOIL_VERSION=$(tr -d ' \n' < VERSION)
          node - <<'EOF'
          const fs = require('fs');
          const info = {
            version: fs.readFileSync('VERSION', 'utf8').trim(),
            build: Number(process.env.GITHUB_RUN_NUMBER),
            sha: String(process.env.GITHUB_SHA).slice(0, 7),
            date: new Date().toISOString(),
          };
          fs.writeFileSync('site/version.json', JSON.stringify(info));
          const p = 'site/index.html';
          let html = fs.readFileSync(p, 'utf8');
          html = html.replace(/<\/head>/i, `    <script>window.SEOIL_BUILD=${JSON.stringify(info)};</script>\n  </head>`);
          fs.writeFileSync(p, html);
          console.log('version:', info);
          EOF

          # --- 빌드 정보 ---
          (cd openoffice && git rev-parse HEAD) > site/BUILD_INFO.txt
          echo "seoil office: v${SEOIL_VERSION} build ${GITHUB_RUN_NUMBER} ${GITHUB_SHA::7}" >> site/BUILD_INFO.txt
          echo "openoffice ref: ${OPENOFFICE_REF}" >> site/BUILD_INFO.txt
          date -u +"built: %Y-%m-%dT%H:%M:%SZ" >> site/BUILD_INFO.txt
          du -sh site
          ls -la site | head -40

      # iOS 앱 빌드(ios-testflight.yml)가 같은 웹 번들을 쓰도록 아티팩트로도 남긴다
      - name: Upload site artifact (for the iOS app build)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 14

      # 개발용: 빌드된 웹 번들(글꼴 제외)을 site-build 브랜치에 둔다 → 개발 환경에서 git으로 받아 엔진을 직접 시험
      - name: Publish build to site-build branch (dev testing)
        run: |
          set -euo pipefail
          rm -rf /tmp/sb && mkdir -p /tmp/sb && cp -r site/. /tmp/sb/ && rm -rf /tmp/sb/fonts
          cd /tmp/sb
          git init -q -b site-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "site build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-build
          du -sh /tmp/sb

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
